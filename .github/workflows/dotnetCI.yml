name: .NET CI

on:
  push:
    branches: [master]
    paths: ['src/**']
  pull_request:
    branches: [master]
    paths: ['src/**']

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Build
      run: dotnet build ./src -c Release
